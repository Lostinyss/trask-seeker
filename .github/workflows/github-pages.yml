name: เผยแพร่ TrashSeeker บน GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ดาวน์โหลด Source Code
        uses: actions/checkout@v6
      - name: ติดตั้ง Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: ติดตั้ง Dependencies
        run: npm ci
      - name: สร้างเว็บไซต์ Static
        run: npm run build:pages
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_TRASHTRACK_API_URL: ${{ vars.TRASHTRACK_API_URL }}
      - name: ตั้งค่า GitHub Pages
        uses: actions/configure-pages@v5
      - name: อัปโหลดเว็บไซต์
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: เผยแพร่เว็บไซต์
        id: deployment
        uses: actions/deploy-pages@v4
