name: เผยแพร่ TrashSeeker บน GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: ดาวน์โหลด Source Code
        uses: actions/checkout@v6
      - name: ตั้งค่า GitHub Pages
        uses: actions/configure-pages@v5
      - name: อัปโหลดเว็บไซต์
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: เผยแพร่เว็บไซต์
        id: deployment
        uses: actions/deploy-pages@v4
